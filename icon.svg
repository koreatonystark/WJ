<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Shine overlay -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#shine)"/>

  <!-- Book body -->
  <g filter="url(#shadow)">
    <!-- Left page -->
    <rect x="108" y="130" width="148" height="252" rx="12" ry="12" fill="#fff" opacity="0.92"/>
    <!-- Right page -->
    <rect x="256" y="130" width="148" height="252" rx="12" ry="12" fill="#f0edff" opacity="0.92"/>
    <!-- Spine -->
    <rect x="246" y="130" width="20" height="252" rx="4" fill="#6c63ff" opacity="0.5"/>
  </g>

  <!-- Left page lines -->
  <rect x="128" y="175" width="108" height="9" rx="4" fill="#6c63ff" opacity="0.55"/>
  <rect x="128" y="200" width="88" height="7" rx="3" fill="#6c63ff" opacity="0.30"/>
  <rect x="128" y="221" width="98" height="7" rx="3" fill="#6c63ff" opacity="0.30"/>
  <rect x="128" y="242" width="72" height="7" rx="3" fill="#6c63ff" opacity="0.30"/>
  <rect x="128" y="263" width="96" height="7" rx="3" fill="#6c63ff" opacity="0.30"/>
  <rect x="128" y="284" width="80" height="7" rx="3" fill="#6c63ff" opacity="0.30"/>
  <rect x="128" y="305" width="100" height="7" rx="3" fill="#6c63ff" opacity="0.30"/>

  <!-- Right page: "W Q" letters -->
  <text x="276" y="235" font-family="'Arial Black', Arial, sans-serif" font-weight="900"
        font-size="72" fill="#6c63ff" opacity="0.85" letter-spacing="-2">W</text>
  <text x="286" y="320" font-family="'Arial Black', Arial, sans-serif" font-weight="900"
        font-size="72" fill="#ff6584" opacity="0.85" letter-spacing="-2">Q</text>

  <!-- Star accent top-right -->
  <circle cx="404" cy="108" r="18" fill="#ffd700" opacity="0.9"/>
  <text x="404" y="116" font-size="20" text-anchor="middle" fill="#0f1117">★</text>
</svg>
